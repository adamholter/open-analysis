<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Analysis redesign mockup · round 7</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #08080a; color: #d8d8dc; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
input, textarea, select { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
#page { display: flex; height: 100vh; }
#stage { flex: 1; position: relative; overflow: hidden; }
#frame { position: absolute; left: 50%; top: 50%; width: 1440px; height: 928px; transform-origin: 0 0; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); }

/* ---------- picker (outside the app) ---------- */
#picker { width: 380px; flex: none; border-left: 1px solid #222; background: #111113; overflow-y: auto; padding: 18px 18px 40px; }
#picker h1 { font-size: 15px; font-weight: 650; color: #f2f2f4; letter-spacing: -.01em; }
#picker .lede { color: #8a8a92; font-size: 12px; margin: 4px 0 14px; }
#picker h2 { font-size: 11px; color: #7c7c85; font-weight: 600; margin: 22px 0 8px; }
.pk-btn { padding: 5px 9px; border-radius: 7px; background: #1b1b1f; color: #b4b4bb; font-size: 12px; border: 1px solid #26262b; text-align: left; }
.pk-btn:hover { background: #222227; color: #eee; }
.pk-btn.on { background: #ececf0; color: #111; border-color: #ececf0; }
.pk-scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pk-scenes .pk-btn { font-size: 11.5px; }
.pk-notes { margin-top: 10px; padding: 10px 12px; border-radius: 9px; background: #17171a; border: 1px solid #222226; color: #a6a6ae; font-size: 12px; }
.pk-notes li { margin-left: 15px; margin-top: 3px; }
.pk-dec { padding: 10px 0; border-top: 1px solid #1d1d21; }
.pk-dec b { display: block; font-size: 12.5px; color: #e6e6ea; font-weight: 600; margin-bottom: 2px; }
.pk-dec p { font-size: 11.5px; color: #7c7c85; margin-bottom: 7px; }
.pk-new { margin-top: 2px; padding: 8px 10px; border-radius: 8px; background: #16161a; border: 1px solid #222227; font-size: 11.5px; color: #9a9aa2; margin-bottom: 8px; }
.pk-new q { color: #cfcfd5; font-style: italic; }
.pk-opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border-radius: 7px; color: #a9a9b1; font-size: 12px; text-align: left; }
.pk-opt:hover { background: #1b1b1f; color: #eee; }
.pk-opt .r { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #55555d; flex: none; }
.pk-opt.on { color: #f4f4f6; background: #1d1d22; }
.pk-opt.on .r { border-color: #f4f4f6; background: radial-gradient(#f4f4f6 0 3px, transparent 3.5px); }
.pk-opt .rec { margin-left: auto; font-size: 10px; color: #6fbf8a; letter-spacing: .03em; }
.pk-pal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pk-sw { border-radius: 9px; padding: 7px 8px 6px; border: 1.5px solid transparent; text-align: left; position: relative; }
.pk-sw.on { border-color: #f4f4f6; box-shadow: 0 0 0 1px #000; }
.pk-sw .bars { display: flex; gap: 3px; margin-bottom: 6px; }
.pk-sw .bars i { height: 14px; border-radius: 3px; flex: 1; }
.pk-sw span { font-size: 10.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-sw .rec { position: absolute; top: 4px; right: 6px; font-size: 9px; color: #6fbf8a; }
.pk-acc { display: flex; flex-wrap: wrap; gap: 6px; }
.pk-acc button { display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 6px; border-radius: 14px; border: 1px solid #26262b; font-size: 11.5px; color: #b4b4bb; }
.pk-acc button i { width: 13px; height: 13px; border-radius: 50%; }
.pk-acc button.on { border-color: #f4f4f6; color: #fff; }
.pk-foot { margin-top: 18px; display: flex; gap: 6px; flex-wrap: wrap; }
#picks { margin-top: 10px; width: 100%; height: 190px; background: #141417; color: #bdbdc4; border: 1px solid #25252a; border-radius: 8px; padding: 8px; font: 11px/1.45 ui-monospace, Menlo, monospace; resize: vertical; }

/* ---------- the app: tokens ---------- */
.desk { position: relative; width: 1440px; height: 928px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.desk ::selection { background: var(--fg); color: var(--bg); }
.d-shad { --font: Geist, Inter, system-ui, sans-serif; --head: Geist, Inter, system-ui, sans-serif; --hw: 600; --ht: -0.025em; --r: 6px; --rl: 10px; }
.d-slop { --font: "Instrument Sans", Inter, system-ui, sans-serif; --head: "Instrument Sans", Inter, system-ui, sans-serif; --hw: 600; --ht: -0.01em; --r: 4px; --rl: 4px; }
.d-aa { --font: Inter, system-ui, sans-serif; --head: "Source Serif 4", Georgia, serif; --hw: 500; --ht: -0.01em; --r: 6px; --rl: 10px; }
.dens-comfortable { --pad: 24px; --gap: 24px; --row: 30px; --sec: 48px; }
.dens-compact { --pad: 16px; --gap: 16px; --row: 24px; --sec: 32px; }
.desk .mono { font-family: "Geist Mono", ui-monospace, monospace; }

/* header */
.hdr { flex: none; height: 56px; display: flex; align-items: center; gap: 20px; padding: 0 32px; border-bottom: 1px solid var(--border); background: var(--bg); position: relative; z-index: 20; }
.logo { display: flex; align-items: center; gap: 9px; font-family: var(--head); font-weight: 600; font-size: 16px; letter-spacing: -0.02em; white-space: nowrap; }
.logo svg { flex: none; }
.d-aa .logo { font-weight: 500; font-size: 18px; letter-spacing: -0.01em; }
.nav { display: flex; align-items: center; gap: 2px; }
.nav button { padding: 6px 10px; border-radius: var(--r); color: var(--muted); font-size: 14px; white-space: nowrap; }
.nav button:hover { color: var(--fg); }
.nav button.on { color: var(--fg); font-weight: 500; }
.d-shad .nav button.on { background: var(--secondary); }
.d-slop .hdr { gap: 28px; }
.d-slop .nav { gap: 22px; align-self: stretch; }
.d-slop .nav button { padding: 0; border-radius: 0; align-self: stretch; display: flex; align-items: center; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.d-slop .nav button.on { border-bottom-color: var(--fg); font-weight: 500; }
.d-slop .nav .sepv { width: 1px; height: 20px; background: var(--border); align-self: center; }
.d-aa .nav { background: var(--secondary); border-radius: var(--r); padding: 3px; }
.d-aa .nav button { padding: 4px 11px; border-radius: 4px; color: var(--fg); }
.d-aa .nav button.on { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 400; }
.hdr-end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.srch { display: flex; align-items: center; gap: 8px; width: 240px; height: 34px; padding: 0 10px; border-radius: var(--r); border: 1px solid var(--border); color: var(--muted); font-size: 13px; background: var(--bg); }
.srch input { flex: 1; min-width: 0; color: var(--fg); }
.srch input::placeholder { color: var(--muted); }
.kbd { font: 11px "Geist Mono", ui-monospace, monospace; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); background: var(--secondary); color: var(--muted); }
.ibtn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--r); color: var(--muted); }
.ibtn:hover { background: var(--secondary); color: var(--fg); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: var(--r); font-size: 13.5px; font-weight: 500; white-space: nowrap; border: 1px solid var(--border); background: var(--card); color: var(--fg); }
.btn:hover { background: var(--secondary); }
.btn.pri { background: var(--acc); color: var(--accfg); border-color: var(--acc); }
.btn.pri:hover { opacity: .9; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--secondary); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.d-aa .btn.pri { background: #7F4BF3; border-color: #7F4BF3; color: #fff; }

/* body */
.body { flex: 1; min-height: 0; display: flex; }
.main { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 32px 32px 64px; scrollbar-width: thin; }
.main.flush { padding-top: 0; }
.sidenav { flex: none; width: 200px; padding: 32px 0 0 32px; display: flex; flex-direction: column; gap: 2px; }
.sidenav button { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13.5px; color: var(--muted); text-align: left; }
.sidenav button:hover, .sidenav button.on { color: var(--fg); }
.sidenav button i { width: 6px; height: 6px; border-radius: 1px; background: var(--border); flex: none; }
.sidenav button.on i { background: var(--fg); }
.sidenav small { margin-left: auto; margin-right: 16px; font-size: 11px; color: var(--muted); }
.d-aa .sidenav button i { width: 8px; height: 8px; border-radius: 0; }

/* filters */
.fbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 12px 0; margin-bottom: 8px; background: var(--bg); border-bottom: 1px solid var(--border); }
.main.flush .fbar { padding-top: 14px; }
.fbar .lbl { font-size: 13px; color: var(--muted); margin-left: 6px; }
.fbar .grow { flex: 1; }
.fbar .note { font-size: 12.5px; color: var(--muted); }
.pbtn { display: inline-flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 200px; height: 34px; padding: 0 10px 0 12px; border: 1px solid var(--border); border-radius: var(--r); background: var(--card); font-size: 13.5px; }
.pbtn b { font-weight: 600; }
.pbtn svg { color: var(--muted); }
.sel { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 12px; border: 1px solid var(--border); border-radius: var(--r); background: var(--card); font-size: 13.5px; white-space: nowrap; }
.sel svg { color: var(--muted); }
.seg { display: inline-flex; height: 34px; padding: 3px; gap: 2px; border-radius: var(--r); background: var(--secondary); }
.seg button { padding: 0 11px; border-radius: calc(var(--r) - 2px); font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--border); }
.d-slop .seg { background: none; padding: 0; gap: 14px; }
.d-slop .seg button { padding: 0; border-radius: 0; }
.d-slop .seg button.on { box-shadow: inset 0 -1.5px var(--fg); background: none; }
.seg.sm { height: 28px; }
.seg.sm button { font-size: 12.5px; padding: 0 9px; }

/* right model panel (filters: side) */
.mpanel { flex: none; width: 300px; border-left: 1px solid var(--border); overflow-y: auto; padding: 20px 20px 32px; background: var(--bg); scrollbar-width: thin; }
.mpanel h3 { display: flex; align-items: baseline; gap: 8px; font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.mpanel h3 small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.mpanel h3 .ibtn { margin-left: auto; width: 26px; height: 26px; }
.mpanel h4 { display: flex; align-items: baseline; justify-content: space-between; font-size: 12.5px; font-weight: 600; margin: 18px 0 6px; }
.mpanel h4 button { font-weight: 400; color: var(--muted); font-size: 12px; }
.mpanel .msearch { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--r); color: var(--muted); }
.mpanel .msearch input { flex: 1; min-width: 0; color: var(--fg); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips button { height: 24px; padding: 0 8px; border-radius: var(--r); border: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.chips button.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }

/* section + cards */
.hero { padding: 8px 0 28px; }
.hero h1 { font-family: var(--head); font-weight: var(--hw); letter-spacing: var(--ht); font-size: 36px; line-height: 1.1; max-width: 860px; }
.d-aa .hero h1 { font-size: 42px; }
.hero p { margin-top: 10px; color: var(--muted); font-size: 15.5px; max-width: 680px; }
.stats { display: flex; gap: 0; margin-top: 22px; border: 1px solid var(--border); border-radius: var(--rl); background: var(--card); width: fit-content; }
.stats div { padding: 12px 22px; border-left: 1px solid var(--border); }
.stats div:first-child { border-left: 0; }
.stats b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.stats span { color: var(--muted); font-size: 12.5px; }
.d-slop .stats, .d-aa .stats { border: 0; background: none; }
.d-slop .stats div, .d-aa .stats div { padding: 0 40px 0 0; border: 0; }
.d-aa .stats b { font-size: 28px; font-weight: 500; }
.sec { margin-top: var(--sec); }
.sec:first-child { margin-top: 0; }
.sech { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 14px; }
.sech h2 { font-family: var(--head); font-weight: var(--hw); letter-spacing: var(--ht); font-size: 22px; line-height: 1.2; }
.d-aa .sech h2 { font-size: 30px; }
.d-aa .sech h2::before { content: ""; display: inline-block; width: 18px; height: 18px; margin-right: 12px; background: var(--fg); vertical-align: -1px; }
.sech p { color: var(--muted); font-size: 13.5px; margin-top: 3px; max-width: 760px; }
.sech .end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--rl); padding: var(--pad); min-width: 0; position: relative; }
.d-slop .card { border: 0; border-radius: 0; padding: 0; background: none; }
.d-slop .sec + .sec { border-top: 1px solid var(--border); padding-top: var(--sec); }
.cardh { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.cardh h3 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.d-aa .cardh h3 { font-family: var(--head); font-size: 20px; font-weight: 500; }
.cardh p { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.cardh .end { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: none; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); font-size: 11px; font-weight: 500; color: var(--muted); white-space: nowrap; vertical-align: 2px; }
.badge.comm { color: var(--fg); border-color: var(--fg); }
.badge.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.link { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border); }
.link:hover { text-decoration-color: var(--fg); }
.muted { color: var(--muted); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.tabs button { padding: 10px 14px; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--muted); font-size: 14px; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--fg); font-weight: 500; }
.toprow { display: grid; grid-template-columns: 1.25fr 1fr; gap: var(--gap); }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 0 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 0 10px; height: calc(var(--row) + 8px); border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th:first-child, .tbl td:first-child { padding-left: 0; }
.tbl th:last-child, .tbl td:last-child { padding-right: 0; }
.tbl .n { text-align: right; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--secondary); }
.tbl .rk { width: 28px; color: var(--muted); }
.tbl .best { font-weight: 600; }
.mdl { display: inline-flex; align-items: center; gap: 8px; }
.mdl i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.mdl small { color: var(--muted); font-size: 12px; }
.ib { display: flex; align-items: center; gap: 8px; }
.ib span { flex: 1; height: 6px; border-radius: 3px; background: var(--secondary); overflow: hidden; }
.ib span i { display: block; height: 100%; border-radius: 3px; }
.ib b { width: 36px; text-align: right; font-weight: 500; }

/* charts */
svg.ch { display: block; overflow: visible; }
svg.ch text { font-family: var(--font); fill: var(--muted); font-size: 11.5px; }
svg.ch .nm { fill: var(--fg); font-size: 12.5px; }
svg.ch .val { fill: var(--fg); font-size: 12px; font-weight: 500; }
svg.ch .grid { stroke: var(--border); stroke-width: 1; }
svg.ch .axis { stroke: var(--border); }
svg.ch .hit { cursor: pointer; }
svg.ch .hit:hover rect.bar, svg.ch .hit:hover circle { opacity: .8; }
.more { margin-top: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; }

/* popover picker */
.pop { position: absolute; z-index: 60; width: 360px; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: var(--rl); box-shadow: 0 16px 40px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.06); overflow: hidden; font-size: 13px; }
.pop .ps { flex: none; display: flex; align-items: center; gap: 8px; margin: 8px; padding: 0 10px; height: 34px; background: var(--secondary); border-radius: var(--r); color: var(--muted); }
.pop .ps input { flex: 1; min-width: 0; color: var(--fg); }
.pop .pe { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 2px 12px 10px; border-bottom: 1px solid var(--border); }
.pop .pe > span { font-size: 12px; color: var(--muted); margin-right: 4px; }
.pop .pl { flex: 1; min-height: 0; overflow-y: auto; padding: 6px; scrollbar-width: thin; }
.prow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 5px 8px; border-radius: var(--r); }
.prow:hover { background: var(--secondary); }
.prow span { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow small { margin-left: auto; color: var(--muted); font-size: 11.5px; }
.prow.sub { margin-left: 13px; width: calc(100% - 13px); padding: 3px 8px 3px 15px; border-left: 1px solid var(--border); border-radius: 0 var(--r) var(--r) 0; }
.prow.sub span { font-weight: 400; color: var(--fg); opacity: .8; }
.prow.off span { color: var(--muted); font-weight: 400; }
.cb { position: relative; width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--c, var(--fg)); flex: none; }
.cb.on { background: var(--c, var(--fg)); }
.cb.on::after { content: ""; position: absolute; left: 3.5px; top: .5px; width: 4px; height: 8px; border: solid var(--card); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); }
.cb.mixed::after { content: ""; position: absolute; left: 2px; right: 2px; top: 4.5px; height: 2px; border-radius: 1px; background: var(--c, var(--fg)); }
.pop .pf { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; padding: 8px; border-top: 1px solid var(--border); background: var(--secondary); }
.pop .pf .btn { height: 30px; font-size: 12.5px; }
.mpanel .prow { padding-left: 0; padding-right: 0; }
.mpanel .prow:hover { background: none; }
.mpanel .prow.sub { margin-left: 6px; padding-left: 14px; width: calc(100% - 6px); }

/* model page */
.mhead { display: flex; align-items: flex-end; gap: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
.mhead h1 { font-family: var(--head); font-weight: var(--hw); letter-spacing: var(--ht); font-size: 34px; line-height: 1.1; }
.mhead .crumb { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.mhead .facts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.mhead .end { margin-left: auto; display: flex; gap: 8px; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--gap); margin-bottom: var(--sec); }
.kpi { border: 1px solid var(--border); border-radius: var(--rl); padding: 14px 16px; background: var(--card); }
.kpi span { color: var(--muted); font-size: 12.5px; }

// ================================================================ round 3: rows per effort, toolbars, presets, filters
/** Efforts of a model that are on, best Open Index first. */
const varsOn = m => m.vars.filter(v => effOn(m, v.e));
const bestVar = m => varsOn(m)[0] || m.vars[0];
/** Show every reasoning level in this chart? (chart settings or header switch) */
const allLv = key => !!A.allG; // round 6: one switch in the model picker for every chart
const csetOf = key => A.cset[key] || (A.cset[key] = { all: false, vals: true, sort: 'value', log: null, front: true });
/** Does this benchmark have more than one reasoning level for the models on the page? (Only then “All levels” changes anything.) */
const multiLv = b => !!b.all && shown().some(m => b.all[m.id] && Object.keys(b.all[m.id]).filter(e => effOn(m, e)).length > 1);
/** The chart's sort setting applied to its rows (value order is the rows' own order). */
function sortRows(rows, key) {
  const so = key ? csetOf(key).sort : 'value';
  if (so === 'name') return rows.slice().sort((a, b) => a.m.name.localeCompare(b.m.name) || (a.v - b.v));
  if (so === 'date') return rows.slice().sort((a, b) => (b.m.release || '').localeCompare(a.m.release || '') || (b.v - a.v));
  return rows;
}
/** Log scale on? The chart's setting, else its default. */
const logOn = (key, def = false) => { const v = key ? csetOf(key).log : null; return v == null ? def : v; };
const ESH = { none: 'None', minimal: 'Min', low: 'Low', medium: 'Med', high: 'High', xhigh: 'XHigh', max: 'Max', default: 'Def' };

/** Open Index rows: best level per model, or every level. */
function scoreRowsK(key) {
  const out = [];
  const min = covMin();
  shown().forEach(m => { if ((m.cov || 0) < min) return; const x = { cov: m.cov, fade: covFade(m) }; if (allLv(key)) varsOn(m).forEach(v => out.push({ m, v: v.s, e: v.e, ...x })); else { const v = bestVar(m); out.push({ m, v: v.s, e: v.e, ...x }); } });
  return out.sort((a, b) => b.v - a.v);
}
function speedRowsK(key) {
  const out = [];
  shown().forEach(m => { const vs = allLv(key) ? varsOn(m) : [bestVar(m)]; vs.forEach(v => { const sp = v.sp ?? m.speed; if (sp) out.push({ m, v: sp, e: v.e }); }); });
  return out.sort((a, b) => b.v - a.v);
}
const costOfVar = (m, v) => A.basis === 'api' ? (v.ca ?? m.costApi) : (v.c ?? m.cost);
/** A benchmark's rows: the best enabled level per model, or every level. Units decide the order. */
function benchRowsK(b, key, own) {
  const out = [];
  shown().forEach(m => {
    if (own && A.cardOff[b.id]?.has(m.id)) return;
    const per = b.all && b.all[m.id];
    if (!per) { if (b.scores[m.id] != null) out.push({ m, v: b.scores[m.id], e: b.eff ? b.eff[m.id] : bestVar(m).e }); return; }
    const es = Object.keys(per).filter(e => effOn(m, e));
    if (!es.length) return;
    if (key && allLv(key)) es.forEach(e => out.push({ m, v: per[e], e }));
    else { const e = es.sort((x, y) => b.higher === false ? per[x] - per[y] : per[y] - per[x])[0]; out.push({ m, v: per[e], e }); }
  });
  return out.sort((a, c) => b.higher === false ? a.v - c.v : c.v - a.v);
}
/** Format and axis for a benchmark's unit. */
function unitOf(b) {
  const vs = Object.values(b.scores);
  if (b.unit === 'percent' && Math.min(...vs) >= 0) return { fmt: pct, max: 100 };
  if (b.unit === 'elo' || Math.max(...vs) > 200) { const lo = Math.min(...vs), hi = Math.max(...vs), st = niceStep((hi - lo) / 3 || 100); return { fmt: v => String(Math.round(v)), min: Math.floor((lo - (hi - lo) * .25) / st) * st, tick: v => String(Math.round(v)) }; }
  return { fmt: v => v.toFixed(1) };
}

    const cx = left + band * (i + .5), c = colourOf(r.m, i), fs = band < 60 ? 10 : 12;

    if (stack && !logS) { let acc = 0; SPLIT[r.m.id].forEach((f, k) => { const v0 = acc, v1 = acc + f * r.v; acc = v1; s += `<rect class="bar" x="${cx - bw / 2}" y="${y(v1)}" width="${bw}" height="${Math.max(0, y(v0) - y(v1))}" fill="${c}" fill-opacity="${(.4 + .6 * (k % 2 ? .55 : 1) * (1 - k / 20)).toFixed(2)}"/>`; }); }
    else s += `<rect class="bar" x="${cx - bw / 2}" y="${y(r.v)}" width="${bw}" height="${Math.max(1, y(lo) - y(r.v))}" rx="3" fill="${c}"/>`;
    if (vals) s += `<text class="val" x="${cx}" y="${y(r.v) - 6}" text-anchor="middle" style="font-size:${band < 40 ? 9 : fs}px">${money(r.v)}</text>`;
    s += nameLines(r.m.name, cx, h - bottom + 16, band, fs, r.e, band < 60 ? 9.5 : 11) + '</g>';
  });
  s += '</svg>';
  if (stack) s += `<div class="legend"><span>Each band is one of the ${D.index.length} index benchmarks, bottom to top: ${D.index.map(n => esc(n)).join(', ')}. The split is sample data; hover a bar for the total.</span></div>`;
  return s;
}

function sceneMethod() {
  const opus = BY['claude-opus-5.5'], ov = bestVar(opus), split = SPLIT[opus.id];
  return `<div class="prose wide" style="padding-top:8px"><h1 class="ph">Methodology</h1><p class="lede3">The Open Index is an equal-weight average of ${D.index.length} independent benchmarks. Changing the list takes a pull request and a public discussion. It lives in <code>open-index.json</code></p></div>
    <div class="grid2" style="margin-top:var(--gap)">${card('Components', 'v0.1 · each benchmark weighs 10 %.', `<table class="tbl"><thead><tr><th>Benchmark</th><th>Category</th><th class="n">Weight</th></tr></thead><tbody>${D.index.map(n => { const b = D.benchmarks.find(x => x.name === n); return `<tr${b ? ` data-a="openBench" data-k="${b.id}"` : ''}><td>${esc(n)}</td><td class="muted">${b ? CAT[b.category] || b.category : '–'}</td><td class="n">10 %</td></tr>`; }).join('')}</tbody></table>`)}
    ${card('How a score is computed', '', `<ol class="olist"><li><b>The ranked unit is a model at one reasoning level.</b> Charts show each model’s best level; the settings show the rest.</li><li><b>Scores are used as published.</b> Percentages stay percentages. Elo becomes win rate against the median model.</li><li><b>Nothing is estimated.</b> A missing result stays missing; coverage (8/10) shows how many of the ten a model has.</li><li><b>Recent models.</b> Charts show the last three months by default. Scores don’t change with the filter.</li><li><b>Capability indexes</b> average the best-covered benchmarks in each category, at most two per publisher.</li></ol>`)}</div>
    <div class="sec">${secH('Pricing', 'Cost per task is what a task really costs, not a token price.')}<div class="grid2">${card('How cost per task works', '', `<ol class="olist"><li>Each benchmark reports a measured cost per task (Artificial Analysis), reasoning tokens included.</li><li>We weight those costs like the index: <code>cost = Σ weight × cost per task ÷ Σ weight</code>. So a model that is cheap on easy tasks but costly on hard ones pays for the hard ones too.</li><li>Prices are API list prices. Subscription plans come later.</li></ol>`)}${card(`Example: ${opus.name} at ${ov.e}`, 'Sample split; the total is real.', `<table class="tbl"><tbody>${D.index.map((n, k) => `<tr><td>${esc(n)}</td><td class="n">10 %</td><td class="n">${money(split[k] * costOfVar(opus, ov) * 10)}</td></tr>`).join('')}<tr><td><b>Weighted cost per task</b></td><td></td><td class="n"><b>${money(costOfVar(opus, ov))}</b></td></tr></tbody></table>`)}</div></div>
    <div class="sec">${secH('Capability indexes', 'Real lists from the site. Each averages the best-covered benchmarks in its category.')}<div class="grid4">${D.caps.map(c => card(c.name, `${c.benches.length} benchmarks`, `<ul class="ulist">${c.benches.map(id => `<li>${esc(benchById(id)?.name || id)}</li>`).join('')}</ul>`)).join('')}</div></div>
    <div class="sec">${secH('Where the data comes from', '')}<div class="prose wide"><p>Public benchmarks come from the open-source scrapers in Priors, which run every two hours. Open Analysis takes that snapshot and adds every benchmark in <code>community/</code>. Every result links to the page it came from.</p></div></div>`;
}

  ['which', 'Which benchmarks, and why', () => `<p>Each one is run by someone other than the labs, is hard for today’s models, and is updated as models come out. Together they cover coding, agents, reasoning, math, knowledge and professional work.</p><table class="tbl"><thead><tr><th>Benchmark</th><th>Category</th><th>Source</th><th class="n">Weight</th><th class="n">Models</th></tr></thead><tbody>${idxB().map(b => `<tr data-a="bxOpen" data-k="${b.id}"><td>${esc(b.name)}${bxLock(b)}</td><td class="muted" title="${esc(catTip(b.cat))}">${catName(b.cat)}</td><td class="muted">${esc(b.src)}</td><td class="n">10 %</td><td class="n">${b.k}</td></tr>`).join('')}</tbody></table>`],
  ['scores', 'How scores are combined', () => `<p>Scores are used as published. Percentages stay percentages. Elo ratings become a win rate against the median model. Nothing is stretched so the leader reads 100.</p><pre><code>Open Index = Σ (weight × score) ÷ Σ weight</code></pre>`],
  ['floor', 'Missing results', () => `<p><b>Nothing is estimated.</b> A missing result stays missing. ${{ cov: `The Open Index averages only the benchmarks a model has results on. Its coverage shows how many of the ${IDX_IDS.length} that is (for example 8/10, above the bar). Models with fewer than 8 are faded: their score rests on less.`, all10: `Only models with results on all ${IDX_IDS.length} index benchmarks are ranked. The others are listed under the chart as “not enough results yet” until their last results are published.`, thresh: `The Open Index averages only the benchmarks a model has results on. You choose how many of the ${IDX_IDS.length} a model needs before it shows (Coverage in the model picker; 8 by default).` }[C('miss')]}</p><p>Why not fill the gaps? An estimate looks like a measurement but isn’t one, and it hides which model was never tested.</p>`],

/** “On this page” and the side nav follow the scroll (IntersectionObserver on the sections, plus the end of the page). */
let SPY = null, SPY_PIN = null;
function spy() {

  const navs = [['.mxtoc button', 'mx-', k => { A.mxSec = k; }], ['.sidenav button', 's-', () => {}]].map(([sel, pre, set]) => ({ btns: [...document.querySelectorAll(sel)], pre, set })).filter(n => n.btns.length);
  if (!navs.length) return;

    navs.forEach(n => {
      const secs = n.btns.map(b => document.getElementById(n.pre + b.dataset.k)).filter(Boolean); if (!secs.length) return;
      let on = secs[0];
      secs.forEach(sec => { if ((sec.getBoundingClientRect().top - mt) / k <= 48) on = sec; });
      if (end) on = secs[secs.length - 1];
      // A click in the contents wins until you scroll yourself (the last sections can't reach the top).
      const pin = main._pin && document.getElementById(n.pre + main._pin); if (pin) on = pin;
      const key = on.id.slice(n.pre.length);

}

// ================================================================ alignment guides (G)
// Green: a left edge that 3 or more items share. Blue: a shared right edge. Red: an item 1 to 5 px off a shared line.
const GUIDE_AREAS = [['.hdr', 'header'], ['.fbar', 'filters'], ['.main', 'main'], ['.sidenav', 'side nav'], ['.mpanel', 'models panel'], ['.pop', 'menu'], ['.card', 'card']];
const CENTRED = '.prechips, .precard .dots, .seg, .btn, .kbd, .tabs, .badge, .stats, .step b, svg.ch, .ib, .chips, .pbtn, .kpi b, .cmpcols, .toast, #tt, .prow small, .mpanel h4 span, .cardh .end';
function drawGuides() {
  const desk = document.querySelector('.desk'); if (!desk) return;
  desk.querySelector('#guides')?.remove(); window.__guides = null;
  if (!S.guides) return;
  const k = scale(), dr = desk.getBoundingClientRect(), X = x => (x - dr.left) / k, Y = y => (y - dr.top) / k;
  let out = '', misses = [], cols = 0;
  GUIDE_AREAS.forEach(([sel, name]) => desk.querySelectorAll(sel).forEach(area => {
    const ar = area.getBoundingClientRect(); if (!ar.width || !ar.height) return;
    const L = [], R = [];
    const vis = r => r.width > 0 && r.height > 0 && r.bottom > Math.max(ar.top, dr.top) && r.top < Math.min(ar.bottom, dr.bottom) && r.left >= ar.left - 1 && r.right <= ar.right + 1;
    const push = (arr, x, r, what) => arr.push({ x: Math.round(X(x) * 2) / 2, t: Y(r.top), b: Y(r.bottom), l: X(r.left), w: r.width / k, what });
    const tw = document.createTreeWalker(area, NodeFilter.SHOW_TEXT, { acceptNode: n => n.textContent.trim() ? 1 : 2 });
    for (let n; (n = tw.nextNode());) {
      const el = n.parentElement; if (!el || el.closest(CENTRED) || el.closest('#guides')) continue;
      if (el.closest('.fbar') && !area.matches('.fbar')) continue; // the sticky bar floats over the page: check it on its own
      const cs = getComputedStyle(el); if (cs.textAlign === 'center' || cs.textAlign === 'right' || el.closest('.n')) continue;
      const rg = document.createRange(); rg.selectNodeContents(n); const r = rg.getClientRects()[0];
      if (r && vis(r)) push(L, r.left, r, n.textContent.trim().slice(0, 24));
    }
    area.querySelectorAll('input').forEach(el => { const r = el.getBoundingClientRect(); if (vis(r)) push(L, r.left, r, (el.value || el.placeholder).slice(0, 24)); });
    area.querySelectorAll('svg.ic, .cb, .mdl i, .card, .btn, .pbtn, .seg, .code').forEach(el => {
      if (el.closest(CENTRED) && !el.matches('.btn, .pbtn, .seg')) return;
      if (el.closest('.fbar') && !area.matches('.fbar')) return;
      if (el === area) return;
      const r = el.getBoundingClientRect(); if (!vis(r)) return;
      if (el.matches('.card, .btn, .pbtn, .seg, .code')) { push(L, r.left, r, el.className.split(' ')[0]); push(R, r.right, r, el.className.split(' ')[0]); return; }
      push(L, r.left, r, 'icon');
    });
    const group = arr => { const g = []; arr.sort((a, b) => a.x - b.x).forEach(e => { const last = g[g.length - 1]; if (last && e.x - last.x0 <= .75) last.items.push(e); else g.push({ x0: e.x, items: [e] }); }); g.forEach(c => { c.x = c.items.reduce((a, b) => a + b.x, 0) / c.items.length; }); return g; };
    const lines = (arr, cls) => {
      const g = group(arr), strong = g.filter(c => c.items.length >= 3);
      strong.forEach(c => { cols++; out += `<div class="gv ${cls}" style="left:${c.x}px;top:${Math.max(0, Y(ar.top))}px;height:${Math.min(ar.height / k, 928)}px"><span>${Math.round(c.x - X(ar.left))}</span></div>`; });
      g.filter(c => c.items.length < 3).forEach(c => {
        const near = strong.find(s2 => Math.abs(s2.x - c.x) >= 1 && Math.abs(s2.x - c.x) <= 5); if (!near) return;
        c.items.forEach(it => { const d = (it.x - near.x).toFixed(1); misses.push({ area: name, what: it.what, x: it.x, off: +d }); out += `<div class="bx" style="left:${it.l}px;top:${it.t}px;width:${Math.max(it.w, 2)}px;height:${it.b - it.t}px"><span>${d > 0 ? '+' : ''}${d}</span></div>`; });
      });
    };
    lines(L, ''); lines(R, 'r');
    out += `<div class="ol" style="left:${X(ar.left)}px;top:${Y(ar.top)}px;width:${ar.width / k}px;height:${ar.height / k}px"></div>`;
  }));
  window.__guides = misses;

}

  h += `<h2>New in round 7</h2>`;
  newD.forEach(d => { h += `<div class="pk-dec"><b>${d.name}</b>${d.fb ? `<div class="pk-new">You said: <q>${d.fb}</q></div>` : ''}${d.note ? `<p>${d.note}</p>` : ''}${radios(d)}${d.scene ? `<button class="pk-btn" style="margin-top:6px" data-scene="${d.scene}">Show it</button>` : ''}</div>`; });
  h += `<h2>Locked from rounds 1–6 (${lockD.length})</h2>`;
  if (!S.unlock) {

    h += lockD.map(d => `<div class="pk-lock"><b>${d.name} <small>R${ROUND[d.id]}</small></b><span>${lbl(d)}${C(d.id) !== LOCKED[d.id] ? ' · changed' : ''}</span></div>`).join('');
